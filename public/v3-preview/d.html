<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v3-D · pixel diurne</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fafaf7; color: #0a0a0a; font-family: 'General Sans', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .back-dash { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.78); color: #fafafa; padding: 6px 10px; font-size: 11px; font-family: ui-monospace, monospace; letter-spacing: 0.04em; text-decoration: none; z-index: 99; backdrop-filter: blur(4px); transition: background 200ms ease; }
  .back-dash:hover { background: #0a0a0a; }
  .label { position: fixed; top: 12px; right: 12px; background: #0a0a0a; color: #fafaf7; padding: 6px 10px; font-size: 11px; font-family: ui-monospace, monospace; z-index: 99; letter-spacing: 0.04em; }

  header { padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e6df; }
  .logo { width: 6.5rem; height: 2.5rem; background-color: #0a0a0a; -webkit-mask-image: url('/media/logo.png'); mask-image: url('/media/logo.png'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  nav { display: flex; gap: 1.75rem; font-family: 'VT323', monospace; font-size: 1.25rem; text-transform: lowercase; }
  nav a { color: #5a5a57; text-decoration: none; }
  nav a:hover { color: #0a0a0a; }

  /* HERO */
  .hero { padding: 5rem 2rem 4rem; max-width: 1280px; margin: 0 auto; }
  .eyebrow { font-family: 'Press Start 2P', monospace; font-size: 0.625rem; color: #5a5a57; letter-spacing: 0.06em; text-transform: lowercase; margin-bottom: 2rem; }
  .title { font-family: 'VT323', monospace; font-weight: 400; font-size: clamp(3.5rem, 11vw, 9rem); line-height: 0.9; letter-spacing: 0; text-transform: lowercase; color: #0a0a0a; max-width: 15ch; }
  .subtitle { font-size: 1.125rem; font-weight: 500; margin-top: 1.25rem; max-width: 36ch; text-transform: lowercase; color: #3a3631; }

  .cta-row { display: flex; gap: 1rem; margin-top: 2.5rem; }
  .cta { display: inline-flex; align-items: center; padding: 0.625rem 1.25rem; font-family: 'VT323', monospace; font-size: 1.25rem; line-height: 1; text-transform: lowercase; text-decoration: none; color: #0a0a0a; background: #ffd967; border: 2px solid #0a0a0a; box-shadow: 4px 4px 0 #0a0a0a; transition: transform 100ms steps(2), box-shadow 100ms steps(2); }
  .cta:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0a0a0a; }
  .cta.ghost { background: transparent; }

  .photo-band { margin-top: 5rem; padding: 0 2rem; max-width: 1280px; margin-left: auto; margin-right: auto; }
  .photo-band-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.5rem; }
  .photo { aspect-ratio: 3/4; background: linear-gradient(135deg, #c8c2af, #8d8675); border: 1px solid #0a0a0a; position: relative; image-rendering: pixelated; }
  .photo span { position: absolute; top: 8px; left: 10px; font-family: 'VT323', monospace; font-size: 0.875rem; color: rgba(0,0,0,0.55); text-transform: lowercase; }
  @media (max-width: 768px) { .photo-band-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<a class="back-dash" href="/v3-preview/">← dashboard</a>
<div class="label">v3 · d · pixel diurne</div>
<header>
  <div class="logo" aria-label="nelly's"></div>
  <nav>
    <a href="#">menu</a><a href="#">contact</a>
  </nav>
</header>
<section class="hero">
  <p class="eyebrow">smash burger · à emporter · biarritz</p>
  <h1 class="title">get your fingers salty.</h1>
  <p class="subtitle">smash burger à emporter. ouvert 7j/7, midi et soir.</p>
  <div class="cta-row">
    <a href="#" class="cta">voir le menu →</a>
    <a href="#" class="cta ghost">@nellysburgerz</a>
  </div>
</section>
<section class="photo-band">
  <div class="photo-band-grid">
    <div class="photo"><span>cuisine</span></div>
    <div class="photo"><span>vitrine</span></div>
    <div class="photo"><span>burger</span></div>
    <div class="photo"><span>menu</span></div>
  </div>
</section>
</body>
</html>
