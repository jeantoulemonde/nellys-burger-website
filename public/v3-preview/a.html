<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v3-A · diner ambré</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,700,800&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f4ecd6; color: #0a0a0a; font-family: 'General Sans', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .label { position: fixed; top: 12px; right: 12px; background: #0a0a0a; color: #f4ecd6; padding: 6px 10px; font-size: 11px; font-family: ui-monospace, monospace; letter-spacing: 0.04em; z-index: 99; }
  header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(10,10,10,0.1); }
  .logo { width: 7rem; height: 2.6rem; background-color: #0a0a0a; -webkit-mask-image: url('/media/logo.png'); mask-image: url('/media/logo.png'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; position: relative; }
  .logo::after { content: ''; position: absolute; left: 0; right: 18%; bottom: -3px; height: 3px; background: #f0a830; }
  nav { display: flex; gap: 2rem; font-size: 0.9375rem; font-weight: 500; text-transform: lowercase; }
  nav a { color: #5a5a57; text-decoration: none; }
  nav a:hover { color: #0a0a0a; }
  .hero { padding: 5rem 2rem 6rem; max-width: 1280px; margin: 0 auto; }
  .index { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #807a6e; margin-bottom: 3rem; display: flex; gap: 0.5rem; }
  .index b { color: #0a0a0a; font-weight: 600; }
  .title { font-weight: 800; font-size: clamp(3rem, 9vw, 7.5rem); line-height: 0.95; letter-spacing: -0.035em; text-transform: lowercase; max-width: 14ch; }
  .title em { font-style: normal; color: #f0a830; }
  .subtitle { font-size: 1.25rem; font-weight: 500; margin-top: 1.5rem; max-width: 36ch; text-transform: lowercase; color: #3a3631; }
  .meta-row { display: flex; gap: 2.5rem; margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(10,10,10,0.12); font-family: ui-monospace, 'SF Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #807a6e; flex-wrap: wrap; }
  .meta-row span b { color: #0a0a0a; font-weight: 600; }
  .photo-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.5rem; max-width: 1280px; margin: 0 auto; padding: 0 2rem; }
  .photo { aspect-ratio: 4/5; background: linear-gradient(135deg, #d4c8a5, #b8a980); position: relative; overflow: hidden; }
  .photo:first-child { aspect-ratio: 16/9; }
  .photo:first-child { grid-column: 1 / -1; aspect-ratio: 21/9; }
  @media (min-width: 768px) { .photo:first-child { grid-column: 1; aspect-ratio: 4/5; } }
  .photo span { position: absolute; bottom: 8px; left: 10px; font-family: ui-monospace, monospace; font-size: 0.625rem; color: rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="label">v3 · a · diner ambré</div>
<header>
  <div class="logo" aria-label="nelly's"></div>
  <nav>
    <a href="#">menu</a>
    <a href="#">contact</a>
  </nav>
</header>
<section class="hero">
  <p class="index"><b>001</b> &nbsp;/&nbsp; hero &nbsp;·&nbsp; biarritz</p>
  <h1 class="title">get your fingers salty<em>.</em></h1>
  <p class="subtitle">smash burger à emporter. trois recettes, deux sides, six boissons.</p>
  <div class="meta-row">
    <span><b>ouverture</b>&nbsp;&nbsp;12h → 22h</span>
    <span><b>depuis</b>&nbsp;&nbsp;2021</span>
    <span><b>21 av. du jardin public</b>&nbsp;&nbsp;biarritz</span>
  </div>
</section>
<section class="photo-row">
  <div class="photo"><span>cuisine</span></div>
  <div class="photo"><span>vitrine</span></div>
  <div class="photo"><span>menu</span></div>
</section>
</body>
</html>
