<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" shape-rendering="crispEdges">
  <!-- joints fins, ton très proche des carreaux pour qu'ils se fondent -->
  <rect width="560" height="560" fill="#cdc3b0"/>

  <!-- 4x4 grille de carreaux, stride 140 (carreau 136 + joint 4) -->
  <g>
    <rect x="2"   y="2"   width="136" height="136" fill="#e8e0d2"/>
    <rect x="142" y="2"   width="136" height="136" fill="#ddd4c4"/>
    <rect x="282" y="2"   width="136" height="136" fill="#e3dac9"/>
    <rect x="422" y="2"   width="136" height="136" fill="#d6cab4"/>

    <rect x="2"   y="142" width="136" height="136" fill="#ddd1bd"/>
    <rect x="142" y="142" width="136" height="136" fill="#e5dccc"/>
    <rect x="282" y="142" width="136" height="136" fill="#d8cdb8"/>
    <rect x="422" y="142" width="136" height="136" fill="#e1d7c4"/>

    <rect x="2"   y="282" width="136" height="136" fill="#e3dac9"/>
    <rect x="142" y="282" width="136" height="136" fill="#d6cab4"/>
    <rect x="282" y="282" width="136" height="136" fill="#e8e0d2"/>
    <rect x="422" y="282" width="136" height="136" fill="#ddd4c4"/>

    <rect x="2"   y="422" width="136" height="136" fill="#d8cdb8"/>
    <rect x="142" y="422" width="136" height="136" fill="#e1d7c4"/>
    <rect x="282" y="422" width="136" height="136" fill="#ddd1bd"/>
    <rect x="422" y="422" width="136" height="136" fill="#e5dccc"/>
  </g>

  <!-- patine subtile : quelques carreaux marqués par le temps, ombrages doux -->
  <g opacity="0.18">
    <ellipse cx="70"  cy="80"  rx="32" ry="22" fill="#9c8a6a"/>
    <ellipse cx="350" cy="210" rx="40" ry="18" fill="#a99576"/>
    <ellipse cx="490" cy="340" rx="28" ry="34" fill="#9c8a6a"/>
    <ellipse cx="200" cy="470" rx="34" ry="20" fill="#b1a081"/>
    <ellipse cx="100" cy="320" rx="22" ry="26" fill="#a99576"/>
    <ellipse cx="430" cy="490" rx="36" ry="16" fill="#9c8a6a"/>
  </g>

  <!-- micro-variations internes : très légers reflets pour casser l'uniformité -->
  <g opacity="0.08">
    <rect x="6"   y="6"   width="60" height="6"  fill="#fff8e8"/>
    <rect x="146" y="6"   width="40" height="4"  fill="#fff8e8"/>
    <rect x="286" y="6"   width="80" height="5"  fill="#fff8e8"/>
    <rect x="426" y="6"   width="50" height="3"  fill="#fff8e8"/>
    <rect x="6"   y="146" width="44" height="5"  fill="#fff8e8"/>
    <rect x="146" y="146" width="72" height="4"  fill="#fff8e8"/>
    <rect x="286" y="146" width="38" height="6"  fill="#fff8e8"/>
    <rect x="426" y="146" width="58" height="4"  fill="#fff8e8"/>
    <rect x="6"   y="286" width="68" height="5"  fill="#fff8e8"/>
    <rect x="146" y="286" width="44" height="4"  fill="#fff8e8"/>
    <rect x="286" y="286" width="56" height="6"  fill="#fff8e8"/>
    <rect x="426" y="286" width="42" height="3"  fill="#fff8e8"/>
    <rect x="6"   y="426" width="50" height="5"  fill="#fff8e8"/>
    <rect x="146" y="426" width="64" height="4"  fill="#fff8e8"/>
    <rect x="286" y="426" width="38" height="6"  fill="#fff8e8"/>
    <rect x="426" y="426" width="70" height="4"  fill="#fff8e8"/>
  </g>

  <!-- ombres internes très douces (bord supérieur) pour faux relief mat -->
  <g opacity="0.06">
    <rect x="2"   y="132" width="136" height="6" fill="#3a3220"/>
    <rect x="142" y="132" width="136" height="6" fill="#3a3220"/>
    <rect x="282" y="132" width="136" height="6" fill="#3a3220"/>
    <rect x="422" y="132" width="136" height="6" fill="#3a3220"/>
    <rect x="2"   y="272" width="136" height="6" fill="#3a3220"/>
    <rect x="142" y="272" width="136" height="6" fill="#3a3220"/>
    <rect x="282" y="272" width="136" height="6" fill="#3a3220"/>
    <rect x="422" y="272" width="136" height="6" fill="#3a3220"/>
    <rect x="2"   y="412" width="136" height="6" fill="#3a3220"/>
    <rect x="142" y="412" width="136" height="6" fill="#3a3220"/>
    <rect x="282" y="412" width="136" height="6" fill="#3a3220"/>
    <rect x="422" y="412" width="136" height="6" fill="#3a3220"/>
    <rect x="2"   y="552" width="136" height="6" fill="#3a3220"/>
    <rect x="142" y="552" width="136" height="6" fill="#3a3220"/>
    <rect x="282" y="552" width="136" height="6" fill="#3a3220"/>
    <rect x="422" y="552" width="136" height="6" fill="#3a3220"/>
  </g>
</svg>
